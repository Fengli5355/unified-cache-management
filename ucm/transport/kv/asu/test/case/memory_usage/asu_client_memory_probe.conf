# Minimal configuration for AsuClientMemoryProbe.IdleClientInitialization.
# Run the test from the repository root so the relative FakeBackend path is stable.

client_id=asu-client-memory-probe
default_wait_timeout_ms=5000

hash_table.type=RING_HASH
ring_hash.virtual_node_count=128

# One ASU uses TransportConfig's default query_qp_num=1 and load/store_qp_num=0.
transport.asu_ids=1
transport.provider_type=FAKE
transport.fake_backend.path=./asu-client-memory-probe-store
transport.fake_backend.latency_ms=0

# FakeProvider still binds the configured ACL device while creating its one connection.
asu_info.1=protocol=TCP,local.comm_id=127.0.0.1,port=19001,local.phy_device_id=0
